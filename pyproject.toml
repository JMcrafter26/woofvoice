[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "woofvoice"
version = "0.2.1"
description = "Stream chat responses through local Underdog Woof TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.30",
    "numpy>=1.24",
    "sounddevice>=0.5.6",
]

[project.scripts]
woofvoice = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["woofvoice"]
